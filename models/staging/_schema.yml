version: 2

models:
  - name: stg_jaffle_shop__customers
    description: customer records from jaffle shop used as the standardized staging view for customer attributes.
    columns:
      - name: customer_id
        description: unique identifier for a customer.
        data_tests:
          - unique
          - not_null
      - name: first_name
        description: customer's given name.
      - name: last_name
        description: customer's family name.
  - name: stg_jaffle_shop__orders
    columns:
      - name: order_id
        description: Primary key for orders.
        data_tests:
          - relationships:
              arguments: 
                to: ref('stg_jaffle_shop__customers')
                field: customer_id
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - completed
                  - shipped
                  - returned
                  - placed
                  - return_pending
