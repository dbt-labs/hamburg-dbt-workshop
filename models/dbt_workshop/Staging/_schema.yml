version: 2

sources:
  - name: jaffle_shop
    database: raw 
    schema: jaffle_shop
    tables:
      - name: customers
      - name: orders
        config:
          freshness:
            warn_after:
              count: 12
              period: hour
            error_after:
              count: 24
              period: hour
          loaded_at_field: _etl_loaded_at

models:
  - name: stg_jaffle_shop__customers
    description: customer master data from jaffle shop used for downstream customer reporting and analysis.
    columns:
      - name: customer_id
        description: unique identifier for a customer.
      - name: first_name
        description: customer's first name.
      - name: last_name
        description: customer's last name.
