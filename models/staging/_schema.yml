version: 2

models:
- name: stg_jaffle_shop__customers
  description: Bereinigte und umbenannte Kundentabelle aus dem Quellsystem Jaffle Shop. Das Modell stellt pro Kunde genau einen Datensatz mit den grundlegenden Stammdaten für nachgelagerte Modelle bereit.
  columns:
    - name: customer_id
      data_tests:
        - unique
        - not_null
- name: stg_jaffle_shop__orders
  columns:
    - name: order_id
      description: Primary key for orders.
      data_tests:
        - relationships:
            arguments: 
              to: ref('stg_jaffle_shop__customers')
              field: customer_id
    - name: status
      data_tests:
        - accepted_values:
            arguments:
              values:
                - completed
                - shipped
                - returned
                - placed
                - return_pending
